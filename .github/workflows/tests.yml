name: tests

on:
  push:
  workflow_dispatch:
  schedule:
    # every night at 18:00 UTC (01:00 in Bangkok)
    - cron: "0 18 * * *"

jobs:
  smoke:
    # fast check on every push
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python -m pytest tests/ -m smoke -v

  full-suite:
    # full suite, including slow tests, every night (or by hand)
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python -m pytest tests/ -v